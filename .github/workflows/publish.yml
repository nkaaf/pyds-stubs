name: "Publish"

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Upload to TestPyPi'
        required: true
        default: false
        type: boolean
      version:
        description: pyds version to publish
        required: true
        type: choice
        options:
          - 1.0
          - 1.0.2
          - 1.0.3

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKING_DIR: versions/${{ github.event.inputs.version }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: ${{ env.WORKING_DIR }}/pyproject.toml

      - name: Install python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ${{ env.WORKING_DIR }}/.python-version

      - name: Build package
        run: |
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags') || (github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true')
    name: "Publish"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Upload package to PyPi
        if: github.event.inputs.test == 'false'
        env:
          name: pypi
          url: https://pypi.org/p/pyds-stubs
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

      - name: Upload package to TestPyPi
        if: github.event.inputs.test == 'true'
        env:
          name: testpypi
          url: https://testpypi.org/p/pyds-stubs
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
